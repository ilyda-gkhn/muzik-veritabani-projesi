<title>ALBÜM — Karma · Tarkan</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{ --bg:#efe9e2; --card:#ffffff; --ink:#1b1b1b; --muted:#bdb8b2; --accent:#B6E2B3; }
*{box-sizing:border-box;}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:Inter,Arial,Helvetica,sans-serif;}
.wrapper{min-height:100vh;display:grid;place-items:center;padding:32px 16px;}
.page{width:min(980px,95vw);background:var(--card);border:1px solid var(--muted);border-radius:20px;box-shadow:0 6px 30px rgba(0,0,0,.08);padding:22px;}
.header{display:flex;gap:22px;align-items:flex-start;flex-wrap:wrap;}
.cover{flex:0 0 300px;height:300px;border-radius:14px;overflow:hidden;border:1px solid var(--bg);box-shadow:0 6px 16px rgba(0,0,0,.08);}
.cover img{width:100%;height:100%;object-fit:cover;}
.meta{flex:1 1 320px;min-width:280px;}
.meta h1{margin:0 0 6px 0;font-family:"Playfair Display",serif;font-size:36px;font-weight:600;}
.meta .artist{font-size:16px;color:#615c56;margin-bottom:8px;}
.meta .year{font-size:13px;color:#8a857f;}
.actions{margin-top:14px;display:flex;gap:10px;flex-wrap:wrap;}
.btn{padding:10px 14px;border:1px solid var(--ink);border-radius:10px;background:linear-gradient(to bottom, transparent calc(100% - 10px), var(--accent) 0);font-weight:600;cursor:pointer;}
.tracks{margin-top:22px;border-top:1px solid var(--muted);padding-top:14px;}
table{width:100%;border-collapse:collapse;}
th,td{padding:10px;border-bottom:1px solid #ece7e1;text-align:left;font-size:14px;}
th:nth-child(1),td:nth-child(1){width:48px;text-align:center;color:#7a756f;}
td.time{width:80px;text-align:right;color:#6f6b66;}
@media (max-width:720px){
  .cover{flex-basis:220px;height:220px;}
  .meta h1{font-size:28px;}
}
</style>
